schema: spec-driven

context: |
  Project: Tabwright, a TypeScript CLI, relay, and Chrome extension that lets agents understand and debug signed-in web applications using composable browser evidence.
  Runtime: Node.js 18+, pnpm workspace, ESM TypeScript.
  Product boundary: no recording, managed business Skill runtime, credential cache, cloud provisioning, accounts or billing. Independent examples are consumers, never installed by the product.
  Compatibility: CLI and relay changes must remain cross-platform; WebSocket protocol changes must remain backward compatible.
  Distribution: public package changes use Changesets; generated website/public skill resources come from versioned source files.

rules:
  proposal:
    - Describe the user-visible outcome and explicit non-goals.
    - List every new or modified capability.
  design:
    - Cover cross-platform paths, upgrade behavior, user-file safety, and package lifecycle failure handling.
  specs:
    - Every Requirement must include at least one observable Scenario.
  tasks:
    - Include focused tests, package typecheck, website typecheck, and final diff review.
