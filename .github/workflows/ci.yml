name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git submodule update --init playwright
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
          run_install: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: node playwright/utils/generate_injected.js
      - run: pnpm playwright:build
      - run: pnpm --dir tabwright typecheck
      - run: pnpm --dir tabwright build
      - run: pnpm --dir tabwright test:unit
      - run: pnpm test:skills
      - run: pnpm --dir tabwright exec playwright-core install chromium --with-deps
      - run: pnpm --dir tabwright test:acceptance
      - name: Install current Chrome for native WebMCP acceptance
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { installChrome } from './tabwright/dist/browser-install.js';
          const { binaryPath } = await installChrome();
          fs.appendFileSync(process.env.GITHUB_ENV, `PLAYWRIGHT_CHROME_EXECUTABLE=${binaryPath}\n`);
          JS
      - name: Verify native WebMCP through the extension
        run: pnpm --dir tabwright exec vitest run src/webmcp.test.ts --no-file-parallelism
      - run: pnpm --dir website typecheck
      - run: pnpm --dir website build
